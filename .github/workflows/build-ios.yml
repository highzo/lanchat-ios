name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install xcodegen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Archive (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project LANChat.xcodeproj \
            -scheme LANChat \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/LANChat.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            | tee build.log | tail -30

      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R "build/LANChat.xcarchive/Products/Applications/LANChat.app" Payload/
          zip -qry LANChat-unsigned.ipa Payload
          ls -lh LANChat-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LANChat-iOS-ipa
          path: LANChat-unsigned.ipa
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
