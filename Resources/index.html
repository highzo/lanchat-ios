<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ededed">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="局域网聊天">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="apple-touch-icon" sizes="180x180" href="/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>局域网聊天</title>
<style>
  :root{
    --side:#ededed; --chatbg:#f5f5f5; --line:#dcdcdc; --own:#95ec69; --ownT:#123;
    --text:#1a1a1a; --muted:#8a8a8a; --brand:#07c160; --link:#576b95;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;background:#e9e9e9;color:var(--text);height:100vh;height:100dvh;overflow:hidden}
  #app{display:flex;height:100vh;height:100dvh}

  /* ---------- 左侧会话列表 ---------- */
  #sidebar{width:300px;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;flex-shrink:0}
  .me{display:flex;align-items:center;gap:10px;padding:14px 14px 12px;border-bottom:1px solid var(--line);background:#e4e4e4;cursor:pointer}
  .ava{width:40px;height:40px;border-radius:5px;background:#4a90d9;color:#fff;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:600;flex-shrink:0}
  .me .info{flex:1;min-width:0}
  .me .info b{display:block;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .me .info span{font-size:11px;color:#0a0}
  .me .chev{color:#aaa;font-size:16px}
  .iconbtn{border:none;background:#f7f7f7;width:30px;height:30px;border-radius:6px;cursor:pointer;font-size:17px;color:#555;line-height:1}
  .iconbtn:hover{background:#dedede}
  #convList{flex:1;overflow-y:auto}
  .sec-title{padding:10px 14px 5px;font-size:11.5px;color:var(--muted)}
  .conv{display:flex;gap:10px;padding:11px 14px;cursor:pointer;align-items:center;border-bottom:1px solid #e0e0e0}
  .conv:hover{background:#e2e2e2}
  .conv.active{background:#d5d5d5}
  .conv .ava{background:#4a90d9}
  .conv .ava.grp{background:#07c160}
  .conv .ava.dev{background:#f0932b}
  .conv .body{flex:1;min-width:0}
  .conv .top{display:flex;justify-content:space-between;gap:6px}
  .conv .nm{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .conv .tm{font-size:11px;color:var(--muted);flex-shrink:0}
  .conv .last{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
  .badge{background:#fa5151;color:#fff;font-size:11px;border-radius:9px;padding:1px 6px;min-width:17px;text-align:center;flex-shrink:0}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--brand);flex-shrink:0}

  /* ---------- 右侧聊天 ---------- */
  #chat{flex:1;display:flex;flex-direction:column;background:var(--chatbg);min-width:0}
  #chatHead{height:56px;display:flex;align-items:center;gap:10px;padding:0 16px;background:#f7f7f7;border-bottom:1px solid var(--line)}
  #chatHead .t{flex:1;min-width:0}
  #chatHead b{font-size:15px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #chatHead span{font-size:11.5px;color:var(--muted)}
  #msgArea{flex:1;overflow-y:auto;padding:16px 18px 8px;overscroll-behavior:contain}
  .sys{text-align:center;margin:10px 0}
  .sys span{font-size:11.5px;color:#fff;background:#c8c8c8;padding:2px 8px;border-radius:4px}
  .row{display:flex;gap:8px;margin-bottom:14px;align-items:flex-start}
  .row.own{flex-direction:row-reverse}
  .row .ava{width:36px;height:36px;font-size:14px}
  .bwrap{max-width:min(560px,72%);min-width:0;display:flex;flex-direction:column;align-items:flex-start}
  .row.own .bwrap{align-items:flex-end}
  .bubble{max-width:100%;padding:9px 12px;border-radius:6px;background:#fff;font-size:14px;line-height:1.55;word-break:break-word;box-shadow:0 1px 1px rgba(0,0,0,.05);position:relative;
    -webkit-user-select:text;user-select:text}
  .row.own .bubble{background:var(--own);color:var(--ownT)}
  .bubble a{color:var(--link);text-decoration:none;word-break:break-all}
  .bubble a:active{opacity:.65}
  .sender{font-size:11.5px;color:var(--muted);margin-bottom:3px}
  .row.own .sender{text-align:right}
  .row.own .bubble .time{color:#4e7a3f}
  .time{font-size:11px;color:#b0b0b0;margin-top:4px;text-align:right;-webkit-user-select:none;user-select:none}
  .filecard{display:flex;gap:10px;align-items:center;padding:4px 2px;min-width:190px;cursor:pointer;-webkit-touch-callout:none}
  .filecard .fi{width:36px;height:36px;border-radius:4px;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
  .filecard .fn{font-size:13.5px;word-break:break-all}
  .filecard .fs{font-size:11px;color:var(--muted)}
  .bubble img.thumb{max-width:min(240px,60vw);max-height:280px;border-radius:6px;display:block;cursor:pointer;-webkit-touch-callout:none}
  .bubble.img-bubble{padding:0;background:none;box-shadow:none;overflow:hidden;border-radius:6px}
  .bubble.img-bubble .time{position:absolute;right:8px;bottom:6px;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.75)}
  #composer{border-top:1px solid var(--line);background:#f7f7f7;padding:10px 14px;display:flex;gap:8px;align-items:flex-end}
  #input{flex:1;resize:none;border:none;border-radius:6px;padding:9px 11px;font-size:14px;font-family:inherit;outline:none;max-height:110px;background:#fff}
  .sendbtn{border:none;background:var(--brand);color:#fff;padding:9px 18px;border-radius:6px;font-size:14px;cursor:pointer;font-family:inherit}
  .sendbtn:disabled{background:#c9c9c9;cursor:default}
  .backbtn{display:none}

  /* ---------- 我的 / 设置页 ---------- */
  #mePage{display:none;flex:1;min-width:0;flex-direction:column;background:#f2f2f2}
  #mePage header{height:56px;display:flex;align-items:center;gap:8px;padding:0 14px;background:#f7f7f7;border-bottom:1px solid var(--line);flex-shrink:0}
  #mePage header b{font-size:15px;flex:1}
  #mePage .backbtn2{display:none;border:none;background:none;font-size:22px;color:#333;width:26px;padding:0;font-family:inherit}
  .mebody{flex:1;overflow-y:auto;padding:12px 12px 24px}
  .mecard{display:flex;align-items:center;gap:12px;background:#fff;border-radius:10px;padding:16px 14px;margin-bottom:12px;cursor:pointer}
  .mecard .ava{width:52px;height:52px;border-radius:8px;font-size:20px;background:#4a90d9}
  .mecard .info{flex:1;min-width:0}
  .mecard .info b{font-size:16px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .mecard .info span{font-size:12px;color:var(--muted)}
  .mecard .chev{color:#c4c4c4;font-size:16px}
  .group{background:#fff;border-radius:10px;margin-bottom:12px;overflow:hidden}
  .gtitle{padding:12px 14px 4px;font-size:12px;color:var(--muted)}
  .gsub{padding:0 14px 8px;font-size:11.5px;color:#b0b0b0;line-height:1.6}
  .cell{display:flex;align-items:center;gap:10px;padding:13px 14px;border-top:1px solid #f2f2f2;font-size:14px;cursor:pointer}
  .cell:first-child{border-top:none}
  .cell .grow{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell .v{color:var(--muted);font-size:12.5px;max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cell .chev{color:#c4c4c4;font-size:16px}
  .cell .sub{font-size:11.5px;color:var(--muted);display:block;margin-top:3px;white-space:normal}
  .mini{border:1px solid var(--brand);color:var(--brand);background:#fff;border-radius:14px;padding:4px 10px;font-size:12.5px;font-family:inherit;cursor:pointer;flex-shrink:0}
  .mini.gray{border-color:#ddd;color:#666}
  .sw{position:relative;width:44px;height:26px;flex-shrink:0}
  .sw input{display:none}
  .sw i{position:absolute;inset:0;background:#ddd;border-radius:13px;transition:.18s}
  .sw i:after{content:'';position:absolute;width:22px;height:22px;background:#fff;border-radius:50%;top:2px;left:2px;transition:.18s;box-shadow:0 1px 2px rgba(0,0,0,.2)}
  .sw input:checked + i{background:var(--brand)}
  .sw input:checked + i:after{left:20px}
  .tag{font-size:10.5px;color:#fff;background:#07c160;border-radius:3px;padding:1px 5px;margin-left:6px;vertical-align:1px}
  .tag.gray{background:#c0c0c0}

  /* ---------- 底部 tabbar（手机） ---------- */
  #tabbar{display:none}

  /* ---------- 遮罩 / 弹窗 ---------- */
  .modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px}
  .modal.show{display:flex}
  .box{background:#fff;border-radius:10px;width:400px;max-width:100%;max-height:82vh;display:flex;flex-direction:column;overflow:hidden}
  .box h3{padding:15px 18px;font-size:15px;border-bottom:1px solid #eee}
  .box .bd{padding:14px 18px;overflow-y:auto;flex:1}
  .box .ft{padding:12px 18px;border-top:1px solid #eee;display:flex;justify-content:flex-end;gap:8px}
  .box input[type=text]{width:100%;padding:9px 11px;border:1px solid #ddd;border-radius:6px;font-size:14px;font-family:inherit;outline:none}
  .box input[type=text]:focus{border-color:var(--brand)}
  .pick{display:flex;align-items:center;gap:9px;padding:9px 4px;border-bottom:1px solid #f2f2f2;cursor:pointer}
  .pick input{width:16px;height:16px;accent-color:var(--brand)}
  .btn2{border:none;padding:8px 16px;border-radius:6px;font-size:13.5px;cursor:pointer;font-family:inherit;background:#f0f0f0;color:#333}
  .btn2.primary{background:var(--brand);color:#fff}
  .hint{font-size:12px;color:var(--muted);line-height:1.7}

  /* ---------- 底部操作面板 ---------- */
  #sheetMask{position:fixed;inset:0;background:rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:.2s;z-index:70}
  #sheetMask.show{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;background:#f2f2f2;border-radius:12px 12px 0 0;
    padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));transform:translateY(112%);transition:transform .22s cubic-bezier(.2,.8,.3,1)}
  #sheet.show{transform:translateY(0)}
  #sheet .grp{background:#fff;border-radius:10px;overflow:hidden;margin-bottom:8px}
  #sheet .item{padding:14px 16px;font-size:15px;text-align:center;border-top:1px solid #f2f2f2;cursor:pointer;color:#1a1a1a}
  #sheet .item:first-child{border-top:none}
  #sheet .item:active{background:#f0f0f0}
  #sheet .item small{display:block;font-size:11.5px;color:var(--muted);margin-top:2px}
  #sheet .item.danger{color:#e64340}
  #sheet .cancel{width:100%;border:none;background:#fff;border-radius:10px;padding:14px;font-size:15px;font-family:inherit;cursor:pointer}
  #sheet .cap{padding:8px 16px 10px;font-size:12px;color:var(--muted);text-align:center;word-break:break-all}

  /* ---------- 图片查看 ---------- */
  #lightbox{position:fixed;inset:0;background:rgba(0,0,0,.93);display:none;flex-direction:column;z-index:80}
  #lightbox.show{display:flex}
  #lightbox .stage{flex:1;display:flex;align-items:center;justify-content:center;overflow:hidden;padding:10px}
  #lightbox img{max-width:100%;max-height:100%;object-fit:contain}
  #lightbox .bar{display:flex;gap:10px;justify-content:center;padding:12px 12px calc(16px + env(safe-area-inset-bottom,0px))}
  #lightbox .bar button{border:none;background:rgba(255,255,255,.16);color:#fff;padding:9px 18px;border-radius:18px;font-size:13.5px;font-family:inherit;cursor:pointer}

  #toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);background:rgba(0,0,0,.82);color:#fff;padding:9px 18px;border-radius:7px;font-size:13px;display:none;z-index:99;max-width:80vw;text-align:center;line-height:1.5}

  /* ---------- 手机适配 ---------- */
  @media (max-width:760px){
    #app{display:block;position:relative}
    #sidebar{width:100%;height:100vh;height:100dvh;border-right:none}
    #convList{padding-bottom:66px}
    #chat{display:none;position:fixed;left:0;right:0;top:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:20}
    body.chat-open #chat{display:flex}
    body.view-me #chat{display:none}
    body.view-me #mePage{display:flex}
    #mePage{display:none;position:fixed;left:0;right:0;top:0;bottom:calc(54px + env(safe-area-inset-bottom,0px));z-index:30}
    #mePage .backbtn2{display:block}
    .mebody{padding:12px 12px 28px}
    .backbtn{display:flex;align-items:center;justify-content:center;border:none;background:transparent;font-size:22px;color:#333;width:30px;cursor:pointer;padding:0}
    .bwrap{max-width:76%}
    #msgArea{padding:12px 12px 6px}
    #composer{padding:8px 10px}
    #tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:60;
      height:calc(54px + env(safe-area-inset-bottom,0px));padding-bottom:env(safe-area-inset-bottom,0px);
      background:#f7f7f7;border-top:1px solid var(--line)}
    #tabbar button{flex:1;border:none;background:none;font-family:inherit;font-size:11px;color:#8a8a8a;
      display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;position:relative;padding:0}
    #tabbar button.on{color:var(--brand)}
    #tabbar .ti{display:block;margin-bottom:1px}
    #tabbar .tbadge{position:absolute;top:4px;left:50%;margin-left:4px;background:#fa5151;color:#fff;
      font-size:10px;border-radius:8px;padding:0 4px;min-width:15px;line-height:15px;display:none}
    #tabbar .tbadge.show{display:block}
    body.view-me #tabbar button.on{color:#8a8a8a}
    body.view-me #tabbar button[data-tab=me]{color:var(--brand)}
    #toast{bottom:calc(70px + env(safe-area-inset-bottom,0px))}
  }
  @media (min-width:761px){
    body.view-me #chat{display:none}
    body.view-me #mePage{display:flex}
    body.view-me #mePage .backbtn2{display:block}
    #sheet{left:50%;right:auto;width:400px;border-radius:12px;transform:translate(-50%,112%);
      padding:8px}
    #sheet.show{transform:translate(-50%,0)}
    #sheet .cancel{margin-bottom:0}
  }
</style>
<style>
html,body{touch-action:manipulation}
input,textarea{-webkit-user-select:text;user-select:text}
</style>
<script>window.__LANCHAT_APP__=1;</script>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="me" id="meBlock">
      <div class="ava" id="myAva">我</div>
      <div class="info">
        <b id="myName">本机</b>
        <span id="mySub">在线 · 可被局域网发现</span>
      </div>
      <div class="chev">›</div>
      <button class="iconbtn" id="btnGroup" title="新建群聊">＋</button>
    </div>
    <div id="convList"></div>
  </aside>

  <section id="chat">
    <header id="chatHead">
      <button class="backbtn" id="btnBack">‹</button>
      <div class="t"><b id="chatTitle">局域网聊天</b><span id="chatSub">选择左侧会话开始聊天</span></div>
      <button class="iconbtn" id="btnMore" title="更多">⋯</button>
    </header>
    <div id="msgArea"></div>
    <footer id="composer">
      <button class="iconbtn" id="btnFile" title="发送文件">📎</button>
      <textarea id="input" rows="1" placeholder="输入消息，Enter 发送"></textarea>
      <button class="sendbtn" id="btnSend">发送</button>
    </footer>
  </section>

  <section id="mePage">
    <header>
      <button class="backbtn2" id="meBack">‹</button>
      <b>我的</b>
    </header>
    <div class="mebody">
      <div class="mecard" id="meCard">
        <div class="ava" id="meAva2">我</div>
        <div class="info"><b id="meName2">本机</b><span id="meSub2">在线</span></div>
        <div class="chev">›</div>
      </div>

      <div class="group">
        <div class="gtitle">系统与权限</div>
        <div id="sysList"></div>
      </div>

      <div class="group">
        <div class="gtitle">消息免打扰</div>
        <div class="gsub">打开后，这个会话/这台设备发的消息不再显示，也不再提醒。随时可以关掉。</div>
        <div id="muteList"></div>
      </div>

      <div class="group">
        <div class="gtitle">聊天记录</div>
        <div class="cell" id="cellCopyConv">
          <span class="grow">复制当前会话聊天记录</span><span class="v" id="copyConvHint">—</span><span class="chev">›</span>
        </div>
        <div class="cell" id="cellExport" style="display:none">
          <span class="grow">导出当前会话为文本文件</span><span class="chev">›</span>
        </div>
      </div>

      <div class="group">
        <div class="gtitle">关于</div>
        <div class="cell"><span class="grow">版本</span><span class="v" id="verText">1.1.0</span></div>
        <div class="cell"><span class="grow">本机地址</span><span class="v" id="addrText">—</span></div>
        <div class="cell"><span class="grow">数据目录</span><span class="v" id="dataText">—</span></div>
        <div class="cell"><span class="grow">工作方式</span><span class="v">点对点 · 无服务器</span></div>
      </div>
    </div>
  </section>
</div>

<nav id="tabbar">
  <button data-tab="chat" class="on">
    <svg class="ti" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M12 3.5c-4.8 0-8.5 3.3-8.5 7.4 0 2.2 1.1 4.1 2.9 5.4V21l3.2-1.8c.8.2 1.6.3 2.4.3 4.8 0 8.5-3.3 8.5-7.4S16.8 3.5 12 3.5z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>
    聊天<i class="tbadge" id="tabBadge"></i>
  </button>
  <button data-tab="me">
    <svg class="ti" viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="8" r="3.8" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4.6 20c1.2-3.5 3.9-5.4 7.4-5.4s6.2 1.9 7.4 5.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    我的
  </button>
</nav>

<!-- 备注弹窗 -->
<div class="modal" id="mRemark">
  <div class="box">
    <h3>设置备注名</h3>
    <div class="bd">
      <input type="text" id="remarkInput" placeholder="给这台设备起个名字，例如：小王的电脑">
      <div class="hint" style="margin-top:8px">备注只保存在本机，方便你认设备。</div>
    </div>
    <div class="ft"><button class="btn2" data-close>取消</button><button class="btn2 primary" id="doRemark">保存</button></div>
  </div>
</div>

<!-- 新建群聊 -->
<div class="modal" id="mGroup">
  <div class="box">
    <h3>新建群聊</h3>
    <div class="bd">
      <input type="text" id="groupName" placeholder="群名称，例如：项目讨论组">
      <div class="hint" style="margin:12px 0 6px">选择成员（仅在线设备可收到消息）</div>
      <div id="pickList"></div>
    </div>
    <div class="ft"><button class="btn2" data-close>取消</button><button class="btn2 primary" id="doGroup">创建</button></div>
  </div>
</div>

<!-- 修改本机名称 -->
<div class="modal" id="mName">
  <div class="box">
    <h3>修改本机名称</h3>
    <div class="bd">
      <input type="text" id="nameInput" placeholder="例如：小王的手机 / 客厅电脑">
      <div class="hint" style="margin-top:8px">这个名字会出现在局域网内所有设备的会话列表里。</div>
    </div>
    <div class="ft"><button class="btn2" data-close>取消</button><button class="btn2 primary" id="doName">保存</button></div>
  </div>
</div>

<!-- 底部操作面板 -->
<div id="sheetMask"></div>
<div id="sheet">
  <div class="grp" id="sheetItems"></div>
  <button class="cancel" id="sheetCancel">取消</button>
</div>

<!-- 图片查看 -->
<div id="lightbox">
  <div class="stage"><img id="lbImg" alt=""></div>
  <div class="bar">
    <button id="lbSave">保存图片</button>
    <button id="lbOpen">浏览器打开</button>
    <button id="lbClose">关闭</button>
  </div>
</div>

<input type="file" id="filePicker" style="display:none" multiple>
<div id="toast"></div>
<script>
const $ = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const state = {
  me:{}, peers:[], convs:[], cur:null, msgs:[], sig:'', byId:{},
  sys:{}, S:{mute_convs:[], mute_devices:[]}, tab:'chat'
};
const IS_APP = !!(window.LanChatNative || (window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lanchat));
const IS_TOUCH = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function toast(msg, ms){ const t=$('#toast'); t.textContent=msg; t.style.display='block';
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display='none', ms||2200); }
function initial(name){ return (name||'?').trim().slice(0,1).toUpperCase(); }
function fmtSize(n){ if(!n) return ''; const u=['B','KB','MB','GB']; let i=0;
  while(n>=1024&&i<u.length-1){n/=1024;i++;} return (i?n.toFixed(1):n)+u[i]; }
function fmtFull(ts){ const d=new Date(ts*1000);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+
    String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0'); }
function fmtTime(ts){
  if(!ts) return '';
  const d=new Date(ts*1000), now=new Date();
  const hm = String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
  if(d.toDateString()===now.toDateString()) return hm;
  const y=new Date(now); y.setDate(now.getDate()-1);
  if(d.toDateString()===y.toDateString()) return '昨天 '+hm;
  if(d.getFullYear()===now.getFullYear()) return (d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
  return d.getFullYear()+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 '+hm;
}
function api(path, opts){
  return fetch(path, Object.assign({headers:{'Content-Type':'application/json'}}, opts||{}))
    .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); });
}

/* ================= 复制 / 链接 / 打开文件 ================= */
function copyText(text){
  text = String(text==null?'':text);
  if(!text){ toast('没有可复制的内容'); return; }
  const done = ok => toast(ok ? '已复制' : '复制失败，请长按文字选择复制');
  const fallback = ()=>{
    try{
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.setAttribute('readonly','');
      ta.style.cssText = 'position:fixed;top:0;left:-9999px;opacity:0;height:1px;width:1px';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      done(ok);
    }catch(e){ done(false); }
  };
  if(navigator.clipboard && window.isSecureContext){
    navigator.clipboard.writeText(text).then(()=>done(true), fallback);
  }else{
    fallback();
  }
}
function fileNameOf(u){ try{ return decodeURIComponent(String(u).split('/').pop().split('?')[0]); }catch(e){ return u; } }
function fileUrl(fid, dl){ return '/api/file?id=' + encodeURIComponent(fid) + (dl ? '&dl=1' : ''); }
function openFileUrl(url){
  // App 内：交给原生下载/打开；浏览器：新标签页打开
  if(IS_APP){ location.href = url; return; }
  const w = window.open(url, '_blank');
  if(!w){ location.href = url; }
}
function linkify(escaped){
  return escaped.replace(/(https?:\/\/[^\s<>"']+)/g, u=>'<a href="'+u+'" target="_blank" rel="noreferrer">'+u+'</a>');
}

/* ================= 偏好设置（存在本机） ================= */
function loadPrefs(){
  try{
    const s = JSON.parse(localStorage.getItem('lanchat_prefs')||'{}');
    state.S = Object.assign({mute_convs:[], mute_devices:[]}, s);
  }catch(e){ state.S = {mute_convs:[], mute_devices:[]}; }
  if(!Array.isArray(state.S.mute_convs)) state.S.mute_convs = [];
  if(!Array.isArray(state.S.mute_devices)) state.S.mute_devices = [];
}
function savePrefs(){
  try{ localStorage.setItem('lanchat_prefs', JSON.stringify(state.S)); }catch(e){}
}
function isMutedConv(c){
  if(!c) return false;
  if(state.S.mute_convs.indexOf(c.id) >= 0) return true;
  if(c.id.indexOf('dm:') === 0 && state.S.mute_devices.indexOf(c.id.slice(3)) >= 0) return true;
  return false;
}
function isMutedSender(id, name){
  if(!id) return false;
  if(state.S.mute_devices.indexOf(id) >= 0) return true;
  return false;
}
function toggleMuteConv(id){
  const i = state.S.mute_convs.indexOf(id);
  if(i >= 0) state.S.mute_convs.splice(i,1); else state.S.mute_convs.push(id);
  savePrefs(); afterMuteChange();
}
function toggleMuteDevice(id){
  const i = state.S.mute_devices.indexOf(id);
  if(i >= 0) state.S.mute_devices.splice(i,1); else state.S.mute_devices.push(id);
  savePrefs(); afterMuteChange();
}
function afterMuteChange(){
  renderConvs(); renderSettings();
  if(state.cur){
    const c = state.convs.find(x=>x.id===state.cur);
    if(isMutedConv(c)){ state.cur=null; state.msgs=[]; document.body.classList.remove('chat-open'); renderMessages(); }
    else { renderMessages(); }
  }
  toast('已保存');
}

/* ================= 会话列表 ================= */
async function loadState(){
  try{
    const d = await api('/api/state');
    state.me = d.me; state.peers = d.peers || [];
    $('#myName').textContent = state.me.name;
    $('#myAva').textContent = initial(state.me.name);
    state.localIp = d.local_ip || '';
    if(d.local_ip) $('#mySub').textContent = '在线 · ' + d.local_ip;
    $('#meName2').textContent = state.me.name;
    $('#meAva2').textContent = initial(state.me.name);
  }catch(e){}
}

function convName(c){
  if(c.type==='group') return c.name;
  return c.name || '未命名';
}

async function loadConvs(){
  try{ const d = await api('/api/convs'); state.convs = d.convs; }
  catch(e){ return; }
  renderConvs();
  if(state.tab==='me') renderSettings();
}

function renderConvs(){
  const box = $('#convList');
  let html = '<div class="sec-title">会话</div>';
  let unreadAll = 0;
  const convs = state.convs.filter(c=> !isMutedConv(c));
  convs.forEach(c => {
    const cls = c.type==='group' ? 'grp' : 'dev';
    unreadAll += (c.unread||0);
    html += `<div class="conv ${state.cur===c.id?'active':''}" data-conv="${esc(c.id)}">
      <div class="ava ${cls}">${c.type==='group'?'群':esc(initial(convName(c)))}</div>
      <div class="body">
        <div class="top"><div class="nm">${esc(convName(c))}</div><div class="tm">${esc(fmtTime(c.ts))}</div></div>
        <div class="last">${esc(c.last||'')}</div>
      </div>
      ${c.unread?`<div class="badge">${c.unread>99?'99+':c.unread}</div>`:''}
    </div>`;
  });

  // 在线但还没聊过的设备
  const chatted = new Set(state.convs.filter(c=>c.type==='direct').map(c=>c.peer_id));
  const fresh = state.peers.filter(p => !chatted.has(p.id) && state.S.mute_devices.indexOf(p.id) < 0);
  if(fresh.length){
    html += '<div class="sec-title">在线设备（点击开始聊天）</div>';
    fresh.forEach(p => {
      html += `<div class="conv" data-newdm="${esc(p.id)}">
        <div class="ava dev">${esc(initial(p.name))}</div>
        <div class="body"><div class="top"><div class="nm">${esc(p.name)}</div></div>
        <div class="last"><span class="dot" style="display:inline-block;margin-right:4px"></span>在线 · 点击聊天</div></div>
      </div>`;
    });
  }

  if(convs.length===0 && fresh.length===0){
    html += '<div class="sec-title" style="padding:24px 14px;line-height:1.9">还没有其他设备在线<br>请让其他电脑/手机打开本程序</div>';
  }
  box.innerHTML = html;

  const badge = $('#tabBadge');
  if(badge){
    if(unreadAll > 0){ badge.textContent = unreadAll > 99 ? '99+' : String(unreadAll); badge.classList.add('show'); }
    else badge.classList.remove('show');
  }

  box.querySelectorAll('[data-conv]').forEach(el=>{
    el.onclick = ()=> openConv(el.dataset.conv);
  });
  box.querySelectorAll('[data-newdm]').forEach(el=>{
    el.onclick = ()=> openConv('dm:'+el.dataset.newdm);
  });
}

/* ================= 聊天窗口 ================= */
async function openConv(convId){
  state.cur = convId; state.msgs = []; state.sig=''; state.byId={};
  document.body.classList.add('chat-open');
  switchTab('chat');
  renderConvs();
  await refreshChat(true);
  api('/api/read', {method:'POST', body: JSON.stringify({conv:convId})}).then(loadConvs).catch(()=>{});
  setTimeout(()=>{ if(!IS_TOUCH) $('#input').focus(); }, 60);
}

function chatMeta(){
  const c = state.convs.find(x=>x.id===state.cur);
  if(state.cur === 'all') return {title:'局域网总群', sub:'所有在线设备都在这个群里'};
  if(state.cur && state.cur.startsWith('dm:')){
    const pid = state.cur.slice(3);
    const p = state.peers.find(x=>x.id===pid);
    return {title: c ? convName(c) : (p?p.name:'私聊'), sub: p ? ('在线 · '+p.ip) : '对方不在线，消息可能发送失败'};
  }
  if(c && c.type==='group'){
    const online = state.peers.filter(p=>c.members.includes(p.id)).length;
    return {title:c.name, sub:`群聊 · ${c.members.length} 人，${online} 人在线`};
  }
  return {title:'局域网聊天', sub:'选择左侧会话开始聊天'};
}

function renderMessages(){
  const area = $('#msgArea');
  if(!state.cur){ area.innerHTML = '<div class="sys"><span>选择左侧的会话开始聊天</span></div>'; return; }
  const muted = state.S.mute_devices;
  const list = state.msgs.filter(m => !(m.sender_id && muted.indexOf(m.sender_id) >= 0 && m.dir !== 'out'));
  if(!list.length){
    area.innerHTML = '<div class="sys"><span>还没有消息，打个招呼吧</span></div>';
    return;
  }
  const showSender = state.cur === 'all' || state.cur.startsWith('grp:');
  let html = '', lastDay = '';
  list.forEach(m => {
    const d = new Date(m.ts*1000);
    const day = d.toDateString();
    if(day !== lastDay){
      lastDay = day;
      html += `<div class="sys"><span>${esc(fmtTime(m.ts).replace(/^\d{2}:\d{2}$/,'今天'))}</span></div>`;
    }
    const own = m.dir === 'out';
    let content = '';
    if(m.kind === 'image'){
      content = `<img class="thumb" src="/api/file?id=${encodeURIComponent(m.file_id)}" data-img="${esc(m.file_id)}">`;
    }else if(m.kind === 'file'){
      content = `<div class="filecard" data-dl="${esc(m.file_id)}"><div class="fi">📄</div><div>
          <div class="fn">${esc(m.file_name)}</div><div class="fs">${fmtSize(m.size)} · 点击打开</div></div></div>`;
    }else{
      content = linkify(esc(m.text).replace(/\n/g,'<br>'));
    }
    const nameBox = (showSender && !own) ? `<div class="sender">${esc(m.sender_name)}</div>` : '';
    html += `<div class="row ${own?'own':''}">
      <div class="ava" style="background:${own?'#4a90d9':'#7d8b99'}">${esc(initial(m.sender_name))}</div>
      <div class="bwrap">
        ${nameBox}
        <div class="bubble ${m.kind==='image'?'img-bubble':''}" data-mid="${esc(m.id)}">${content}
          <div class="time">${esc(fmtTime(m.ts))}</div>
        </div>
      </div>
    </div>`;
  });
  area.innerHTML = html;
  state.byId = {};
  list.forEach(m=> state.byId[m.id] = m);

  area.querySelectorAll('[data-img]').forEach(img => {
    img.onclick = ()=> showImage(img.dataset.img);
    img.oncontextmenu = ev => { ev.preventDefault(); msgMenu(img.closest('.bubble').dataset.mid); };
  });
  area.querySelectorAll('[data-dl]').forEach(el=>{
    el.onclick = ev => { ev.stopPropagation(); msgMenu(el.closest('.bubble').dataset.mid); };
  });
  area.querySelectorAll('.bubble').forEach(b=>{
    b.oncontextmenu = ev => { ev.preventDefault(); msgMenu(b.dataset.mid); };
  });
  area.scrollTop = area.scrollHeight;
}

async function refreshChat(force){
  if(!state.cur) return;
  const meta = chatMeta();
  $('#chatTitle').textContent = meta.title;
  $('#chatSub').textContent = meta.sub;
  try{
    const d = await api('/api/messages?conv=' + encodeURIComponent(state.cur));
    const sig = d.messages.map(m=>m.id).join(',') + '|' + d.messages.length;
    if(force || sig !== state.sig){
      state.sig = sig; state.msgs = d.messages;
      renderMessages();
    }
  }catch(e){}
}

/* ================= 图片查看 ================= */
function showImage(fid){
  if($('#sheet').classList.contains('show')) return;
  const box = $('#lightbox');
  $('#lbImg').src = fileUrl(fid, false);
  box.dataset.fid = fid;
  box.classList.add('show');
}
$('#lbClose').onclick = ()=> $('#lightbox').classList.remove('show');
$('#lbImg').onclick = ()=> $('#lightbox').classList.remove('show');
$('#lbSave').onclick = ()=> openFileUrl(fileUrl($('#lightbox').dataset.fid, true));
$('#lbOpen').onclick = ()=>{
  const u = fileUrl($('#lightbox').dataset.fid, false);
  $('#lightbox').classList.remove('show');
  openFileUrl(u);
};

/* ================= 底部操作面板 ================= */
function showSheet(title, items){
  const box = $('#sheetItems');
  const cap = title ? `<div class="cap">${esc(title)}</div>` : '';
  box.innerHTML = cap + items.map((it,i)=>`<div class="item ${it.danger?'danger':''}" data-i="${i}">${esc(it.t)}${it.s?`<small>${esc(it.s)}</small>`:''}</div>`).join('');
  box.querySelectorAll('[data-i]').forEach(el=>{
    el.onclick = ()=>{ closeSheet(); const f = items[+el.dataset.i].fn; if(f) setTimeout(f, 60); };
  });
  $('#sheetMask').classList.add('show');
  $('#sheet').classList.add('show');
}
function closeSheet(){
  $('#sheetMask').classList.remove('show');
  $('#sheet').classList.remove('show');
}
$('#sheetMask').onclick = closeSheet;
$('#sheetCancel').onclick = closeSheet;

function msgMenu(mid){
  if($('#sheet').classList.contains('show')) return;
  const m = state.byId[mid];
  if(!m) return;
  const items = [];
  if(m.kind === 'text'){
    items.push({t:'复制文字', fn:()=>copyText(m.text)});
    items.push({t:'复制这条（带发送人和时间）', fn:()=>copyText(msgLine(m))});
  }else if(m.kind === 'image'){
    items.push({t:'查看大图', fn:()=>showImage(m.file_id)});
    items.push({t:'保存图片', fn:()=>openFileUrl(fileUrl(m.file_id, true))});
    items.push({t:'复制图片链接', fn:()=>copyText(location.origin + fileUrl(m.file_id, false))});
  }else{
    items.push({t:'打开文件', fn:()=>openFileUrl(fileUrl(m.file_id, false))});
    items.push({t:'保存到本机', fn:()=>openFileUrl(fileUrl(m.file_id, true))});
    items.push({t:'复制文件名', fn:()=>copyText(m.file_name)});
    items.push({t:'复制文件链接', fn:()=>copyText(location.origin + fileUrl(m.file_id, false))});
  }
  items.push({t:'复制整个会话聊天记录', fn:copyConvText});
  showSheet(m.kind==='text' ? '' : (m.file_name || '文件'), items);
}

function msgLine(m){
  const who = m.dir==='out' ? '我' : (m.sender_name || '对方');
  const time = fmtFull(m.ts);
  let body;
  if(m.kind === 'image') body = '[图片] ' + (m.file_name||'');
  else if(m.kind === 'file') body = '[文件] ' + (m.file_name||'') + ' (' + fmtSize(m.size) + ')';
  else body = m.text;
  return who + ' ' + time + '\n' + body;
}
function convTranscript(){
  const list = state.msgs;
  if(!list.length) return '';
  const head = '【' + chatMeta().title + '】聊天记录导出\n共 ' + list.length + ' 条 · 导出于 ' + fmtFull(Date.now()/1000) + '\n' +
    '———————————————\n';
  return head + list.map(msgLine).join('\n\n') + '\n';
}
function copyConvText(){
  if(!state.cur){ toast('请先打开一个会话'); return; }
  if(!state.msgs.length){ toast('这个会话还没有消息'); return; }
  copyText(convTranscript());
}

/* ================= 长按菜单（仅文件/图片，文本保留系统选择） ================= */
let pressTimer = null, pressMoved = false;
const msgArea = $('#msgArea');
msgArea.addEventListener('touchstart', e=>{
  const b = e.target.closest('.bubble');
  if(!b) return;
  const m = state.byId[b.dataset.mid];
  if(!m || m.kind === 'text') return;   // 文本交给系统长按选择
  pressMoved = false;
  clearTimeout(pressTimer);
  pressTimer = setTimeout(()=>{ if(!pressMoved) msgMenu(b.dataset.mid); }, 460);
}, {passive:true});
msgArea.addEventListener('touchmove', ()=>{ pressMoved = true; clearTimeout(pressTimer); }, {passive:true});
msgArea.addEventListener('touchend', ()=> clearTimeout(pressTimer), {passive:true});
msgArea.addEventListener('touchcancel', ()=> clearTimeout(pressTimer), {passive:true});

/* ================= 发送 ================= */
async function sendText(){
  const el = $('#input');
  const text = el.value.trim();
  if(!text || !state.cur) return;
  el.value=''; el.style.height='auto'; $('#btnSend').disabled = true;
  try{
    const r = await api('/api/send', {method:'POST', body: JSON.stringify({conv:state.cur, text})});
    if(r.total > 0 && r.delivered === 0) toast('消息已保存，但对方不在线，未送达');
    await refreshChat(true); await loadConvs();
  }catch(e){ toast('发送失败'); }
  $('#btnSend').disabled = false;
}

async function sendFiles(files){
  if(!state.cur || !files.length) return;
  for(const f of files){
    toast('正在发送 ' + f.name + ' …', 120000);
    try{
      const up = await fetch('/api/upload?name=' + encodeURIComponent(f.name), {method:'POST', body:f});
      if(!up.ok) throw 0;
      const info = await up.json();
      const r = await api('/api/send', {method:'POST', body: JSON.stringify({
        conv: state.cur, kind: info.kind, file_id: info.id, file_name: info.name, size: info.size
      })});
      if(r.total > 0 && r.delivered === 0) toast('文件已保存，但对方不在线，未送达');
      toast('已发送 ' + f.name);
    }catch(e){ toast('发送失败：' + f.name); }
  }
  await refreshChat(true); await loadConvs();
}

/* ================= 我的 / 设置 ================= */
function switchTab(tab){
  state.tab = tab;
  document.body.classList.toggle('view-me', tab === 'me');
  $$('#tabbar button').forEach(b=> b.classList.toggle('on', b.dataset.tab === tab));
  if(tab === 'me'){
    document.body.classList.remove('chat-open');
    renderSettings();
    if(!IS_APP) loadSystem().then(renderSettings);
  }else{
    if(state.cur) document.body.classList.add('chat-open');
  }
}

function cellHtml(left, right, sub, act){
  return `<div class="cell" ${act?`data-act="${act}"`:''}><span class="grow">${left}${sub?`<span class="sub">${sub}</span>`:''}</span>${right||''}</div>`;
}
function switchHtml(id, on){
  return `<label class="sw"><input type="checkbox" data-sw="${id}" ${on?'checked':''}><i></i></label>`;
}

function renderSettings(){
  const S = state.S;
  $('#meName2').textContent = (state.me && state.me.name) || '本机';
  $('#meAva2').textContent = initial((state.me && state.me.name)||'我');
  $('#meSub2').textContent = '在线 · ' + ((state.sys && state.sys.ip) || state.localIp || '点对点直连');
  $('#verText').textContent = (state.sys && state.sys.version) ? state.sys.version : '1.1.0';
  $('#addrText').textContent = ((state.sys && state.sys.ip) || state.localIp || '—') + (state.sys && state.sys.port ? (':' + state.sys.port) : '');
  $('#dataText').textContent = (state.sys && state.sys.data_dir) ? state.sys.data_dir : (IS_APP ? '应用内部存储' : '—');

  /* ---- 系统与权限 ---- */
  let h = '';
  if(IS_APP){
    h += cellHtml('通知权限', '<button class="mini" data-act="notif">去开启</button>');
    h += cellHtml('后台运行 / 电池不限制', '<button class="mini" data-act="battery">去开启</button>', '熄屏后仍能收到消息');
    h += cellHtml('开机自启动（部分手机需手动开启）', '<button class="mini" data-act="autostart">去设置</button>', '手机厂商的自启动管理里允许本应用');
    h += cellHtml('本机地址', `<span class="v">${esc((state.sys&&state.sys.ip)||'')}</span>`);
  }else{
    const s = state.sys || {};
    if(s.is_windows){
      h += cellHtml('Windows 防火墙放行', `<span class="v">${s.firewall?'已放行':'未放行'}</span><button class="mini" data-act="fw">${s.firewall?'重新放行':'一键放行'}</button>`, '不点会一直显示「对方不在线」，需要管理员权限');
      h += cellHtml('开机自启动（电脑）', switchHtml('autostart', s.autostart===true), '登录 Windows 后自动打开聊天');
    }
    h += cellHtml('复制本机访问地址', `<span class="v">${esc((s.ip||'')+':'+(s.port||''))}</span><span class="chev">›</span>`, '', 'copyaddr');
    h += cellHtml('打开数据目录', '<span class="chev">›</span>', '聊天数据库和收到的文件都在这里', 'opendata');
    h += cellHtml('重新检查防火墙状态', '<button class="mini gray" data-act="fwcheck">检查</button>');
  }
  $('#sysList').innerHTML = h;
  $('#sysList').querySelectorAll('[data-act]').forEach(el=>{
    el.onclick = ev => { ev.stopPropagation(); doSysAct(el.dataset.act, el); };
  });
  const sw = $('#sysList').querySelector('[data-sw=autostart]');
  if(sw) sw.onchange = ()=> setAutostart(sw.checked);

  /* ---- 消息免打扰：会话 + 设备 ---- */
  let m = '';
  const convRows = state.convs.slice();
  if(convRows.length){
    m += '<div class="cell" style="cursor:default"><span class="hint">不看这些会话（消息不再显示、不计未读）</span></div>';
    convRows.forEach(c=>{
      const on = state.S.mute_convs.indexOf(c.id) >= 0;
      const tag = c.id==='all' ? '总群' : (c.type==='group' ? '群' : '私聊');
      m += `<div class="cell"><span class="grow">${esc(convName(c))}<span class="tag ${c.id==='all'?'':'gray'}">${tag}</span></span>${switchHtml('conv:'+c.id, on)}</div>`;
    });
  }
  const devRows = state.peers.slice();
  state.S.mute_devices.forEach(did=>{
    if(!devRows.some(p=>p.id===did)) devRows.push({id:did, name:'设备 '+did.slice(0,6), offline:true});
  });
  if(devRows.length){
    m += '<div class="cell" style="cursor:default"><span class="hint">不看这台设备发的消息（在总群/群里直接过滤掉）</span></div>';
    devRows.forEach(p=>{
      const on = state.S.mute_devices.indexOf(p.id) >= 0;
      m += `<div class="cell"><span class="grow">${esc(p.name)}<span class="tag gray">设备</span></span>${switchHtml('dev:'+p.id, on)}</div>`;
    });
  }
  if(!convRows.length && !devRows.length){
    m = '<div class="cell"><span class="hint">还没有会话。等别人发消息过来，这里就会出现开关。</span></div>';
  }
  $('#muteList').innerHTML = m;
  $('#muteList').querySelectorAll('[data-sw]').forEach(sw2=>{
    const key = sw2.dataset.sw;
    sw2.onchange = ()=>{
      if(key.indexOf('conv:')===0) toggleMuteConv(key.slice(5));
      else if(key.indexOf('dev:')===0) toggleMuteDevice(key.slice(4));
    };
  });

  /* ---- 聊天记录 ---- */
  const curName = state.cur ? chatMeta().title : '';
  $('#copyConvHint').textContent = state.cur ? (curName + ' · ' + state.msgs.length + ' 条') : '先在聊天里打开一个会话';
  $('#cellExport').style.display = IS_APP ? 'none' : 'flex';
}

async function loadSystem(){
  try{ state.sys = await api('/api/system'); }catch(e){ state.sys = {}; }
}

async function doSysAct(act){
  if(act === 'notif'){ nativeCall('openNotificationSettings'); toast('已打开通知设置'); return; }
  if(act === 'battery'){ nativeCall('openBatterySettings'); toast('请选择「不限制 / 允许后台运行」'); return; }
  if(act === 'autostart'){ nativeCall('openAutoStartSettings'); toast('请在列表中允许本应用自启动'); return; }

  if(act === 'fw' || act === 'fwcheck'){
    if(act === 'fw'){ toast('正在放行防火墙，请稍候…', 6000); }
    try{
      const r = await fetch('/api/system/firewall', {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({force: act==='fw'})}).then(x=>x.json());
      state.sys = Object.assign({}, state.sys, r);
      if(r.firewall) toast('防火墙已放行');
      else toast(r.msg || '放行失败：请右键程序 →「以管理员身份运行」后再试', 5000);
    }catch(e){ toast('操作失败'); }
    renderSettings();
    return;
  }
  if(act === 'opendata'){
    try{ await fetch('/api/system/opendata', {method:'POST', headers:{'Content-Type':'application/json'}, body:'{}'}); }
    catch(e){}
    return;
  }
  if(act === 'copyaddr'){
    copyText((state.sys.ip||'') + ':' + (state.sys.port||''));
  }
}

async function setAutostart(on){
  try{
    const r = await fetch('/api/system/autostart', {method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({on: on})}).then(x=>x.json());
    if(r && r.ok){ state.sys.autostart = !!on; toast(on?'已设置开机自启动':'已关闭开机自启动'); }
    else toast((r && r.msg) || '设置失败');
  }catch(e){ toast('设置失败'); }
  loadSystem().then(renderSettings);
}

function nativeCall(cmd, arg){
  try{
    if(window.LanChatNative && typeof window.LanChatNative[cmd] === 'function'){
      window.LanChatNative[cmd](arg==null?'':String(arg));
      return true;
    }
    if(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.lanchat){
      window.webkit.messageHandlers.lanchat.postMessage({cmd: cmd, arg: arg==null?'':String(arg)});
      return true;
    }
  }catch(e){}
  toast('当前环境不支持，请在系统设置里手动开启');
  return false;
}

/* ================= 事件绑定 ================= */
$('#btnSend').onclick = sendText;
$('#input').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
});
$('#input').addEventListener('input', function(){
  this.style.height='auto'; this.style.height = Math.min(this.scrollHeight, 110)+'px';
});
$('#btnFile').onclick = ()=> $('#filePicker').click();
$('#filePicker').onchange = e => { sendFiles([...e.target.files]); e.target.value=''; };
$('#btnBack').onclick = ()=>{ document.body.classList.remove('chat-open'); state.cur=null; renderConvs(); };
$('#meBlock').onclick = ()=> switchTab('me');
$('#meBack').onclick = ()=> switchTab('chat');
$('#meCard').onclick = ()=>{
  $('#nameInput').value = (state.me && state.me.name) || '';
  $('#mName').classList.add('show');
};
$('#doName').onclick = async ()=>{
  const v = $('#nameInput').value.trim();
  if(!v){ toast('名字不能为空'); return; }
  await api('/api/me', {method:'POST', body: JSON.stringify({name:v})});
  $('#mName').classList.remove('show');
  await loadState(); await loadConvs();
  toast('已保存，其他设备几秒内会更新');
};
function openRemark(){
  if(!state.cur || !state.cur.startsWith('dm:')){ toast('只能在单聊里给设备设备注'); return; }
  const pid = state.cur.slice(3);
  const p = state.peers.find(x=>x.id===pid);
  const cur = state.convs.find(c=>c.id===state.cur);
  $('#remarkInput').value = (cur && cur.remark) ? cur.remark : (p?p.name:'');
  $('#mRemark').dataset.pid = pid;
  $('#mRemark').classList.add('show');
}
$('#doRemark').onclick = async ()=>{
  const pid = $('#mRemark').dataset.pid;
  const remark = $('#remarkInput').value.trim();
  await api('/api/remark', {method:'POST', body: JSON.stringify({id:pid, remark})});
  $('#mRemark').classList.remove('show');
  await loadState(); await loadConvs(); await refreshChat(true);
  toast('备注已保存');
};
document.querySelectorAll('[data-close]').forEach(b=> b.onclick = ()=> b.closest('.modal').classList.remove('show'));
$('#btnGroup').onclick = (ev)=>{
  ev.stopPropagation();
  $('#groupName').value='';
  const list = $('#pickList');
  if(!state.peers.length){ list.innerHTML = '<div class="hint">当前没有其他在线设备，无法拉群。等设备上线后再试。</div>'; }
  else{
    list.innerHTML = state.peers.map(p=>`<label class="pick"><input type="checkbox" value="${esc(p.id)}"><span>${esc(p.name)}</span></label>`).join('');
  }
  $('#mGroup').classList.add('show');
};
$('#doGroup').onclick = async ()=>{
  const name = $('#groupName').value.trim() || '新群聊';
  const members = [...document.querySelectorAll('#pickList input:checked')].map(i=>i.value);
  if(!members.length){ toast('至少选择一个成员'); return; }
  const r = await api('/api/group', {method:'POST', body: JSON.stringify({name, members})});
  $('#mGroup').classList.remove('show');
  await loadConvs();
  if(r && r.id) openConv(r.id);
  toast('群聊已创建');
};

/* 会话更多操作 */
$('#btnMore').onclick = ()=>{
  if(!state.cur){ toast('先选择一个会话'); return; }
  const c = state.convs.find(x=>x.id===state.cur);
  const items = [
    {t:'复制本会话聊天记录', s:'共 ' + state.msgs.length + ' 条', fn: copyConvText}
  ];
  if(!IS_APP) items.push({t:'导出为文本文件', fn: ()=>{ location.href = '/api/export?conv=' + encodeURIComponent(state.cur); }});
  if(state.cur.startsWith('dm:')) items.push({t:'给这台设备设备注', fn: openRemark});
  items.push({t: isMutedConv(c) ? '取消消息免打扰' : '消息免打扰（不看这个会话）',
              fn: ()=> toggleMuteConv(state.cur)});
  showSheet(chatMeta().title, items);
};

/* ================= tabbar ================= */
$$('#tabbar button').forEach(b=>{
  b.onclick = ()=> switchTab(b.dataset.tab);
});

/* ================= 轮询 ================= */
async function tick(){
  await loadState();
  await loadConvs();
  if(state.cur && state.tab==='chat') await refreshChat(false);
}
setInterval(tick, 2000);
(async ()=>{
  loadPrefs();
  await loadState();
  await loadConvs();
  if(!IS_APP) { await loadSystem(); }
  else { state.sys = {}; }
  renderSettings();
  // 默认进入总群（若总群被设为免打扰，就进第一个能看的会话）
  const visible = state.convs.filter(c=> !isMutedConv(c));
  const first = visible.find(c=>c.id==='all') || visible[0];
  if(first) openConv(first.id);
})();
</script>
</body>
</html>
