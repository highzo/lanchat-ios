name: LANChat
options:
  bundleIdPrefix: com.lanchat
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1,2"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""

targets:
  LANChat:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: 局域网聊天
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: 局域网聊天需要访问本地网络，以便自动发现同一 WiFi 下的电脑和手机，并互相收发消息与文件。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        ITSAppUsesNonExemptEncryption: false
        UIRequiresFullScreen: true

schemes:
  LANChat:
    build:
      targets:
        LANChat: all
    run:
      config: Debug
    archive:
      config: Release
